spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  profiles:
    active: qa

server:
  tomcat:
    max-swallow-size: 12MB

approval:
  escalation:
    enabled: false
  notifications:
    enabled: false

# Eureka service id for erm-command-organization (used by OrganizationCommandProxyController)
erm:
  command-organization:
    service-id: ERM-COMMAND-ORGANIZATION
